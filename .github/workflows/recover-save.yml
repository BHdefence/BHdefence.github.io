name: 저장 복구 (일회용)

# One-off: an empty browser copy overwrote kkjlg's cloud save at 03:49:36 KST on 2026-10-15.
# D1 Time Travel can only restore the whole database in place, so this job bookmarks the present, steps back to
# 03:49:00 KST, reads that one save, returns to the bookmark at once, then writes the save back.
on:
  push:
    branches: [main]
    paths: [".github/workflows/recover-save.yml"]

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB: bonghwa
      USER_ID: kkjlg
      AT: "2026-10-14T18:49:00Z"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recover one save
        run: |
          set -euo pipefail
          npm i -g wrangler@4.42.0 >/dev/null 2>&1
          BM='[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}'

          # 1. Bookmark the present. Without D1 rights this fails here and nothing has changed.
          wrangler d1 time-travel info "$DB" --json | tee now.txt
          NOW=$(grep -oE "$BM" now.txt | head -1)
          [ -n "$NOW" ] || { echo "no bookmark, stopping"; exit 1; }
          echo "present bookmark: $NOW"

          # 2. Step back, read the one save, and always come back to the present.
          wrangler d1 time-travel restore "$DB" --timestamp="$AT" --json | tee past.txt
          set +e
          wrangler d1 execute "$DB" --remote --json --command "SELECT data FROM saves WHERE user_id = '$USER_ID'" > old.json
          READ=$?
          back=1
          for i in 1 2 3 4 5; do
            wrangler d1 time-travel restore "$DB" --bookmark="$NOW" --json && { back=0; break; }
            sleep 5
          done
          set -e
          [ $back -eq 0 ] || { echo "COULD NOT RETURN TO $NOW - restore it by hand"; exit 1; }
          [ $READ -eq 0 ] || { echo "reading the old save failed"; exit 1; }

          # 3. Put the old save back only if it really holds progress.
          node -e '
            const fs = require("fs"), id = process.env.USER_ID;
            const row = (JSON.parse(fs.readFileSync("old.json", "utf8"))[0].results || [])[0];
            if (!row) { console.log("no save at that time"); process.exit(2); }
            const d = JSON.parse(row.data);
            console.log("found:", JSON.stringify({ runs: d.runs, shards: d.shards, perks: d.perks, wins: d.wins, best: d.best, playSec: Math.round(d.playSec || 0) }));
            if (!(d.runs > 0)) { console.log("old save has no runs, leaving it"); process.exit(3); }
            const now = Date.now(); d.savedAt = now;
            const q = s => "\x27" + s.replace(/\x27/g, "\x27\x27") + "\x27";
            fs.writeFileSync("fix.sql",
              `UPDATE saves SET data = ${q(JSON.stringify(d))}, at = ${now} WHERE user_id = ${q(id)};\n` +
              `INSERT OR REPLACE INTO hits (k, n, until) VALUES (${q("ops:recover:" + id)}, ${Math.floor(d.runs)}, ${now + 7 * 864e5});\n`);
          '
          wrangler d1 execute "$DB" --remote --file=fix.sql
          echo "restored"
