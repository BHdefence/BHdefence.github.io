@import url('https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Song+Myung&display=swap');
/* Layout: the night battlefield sits in the middle; the market stall (상점) and the beacon's own wing (체력·천벌·봇짐)
   flank it like two lacquered wooden wings, one under each thumb on a phone held sideways.
   Materials: 옻칠 lacquer wood for the wings, 한지 paper for scrolls and menus, 단청 bands for trim, 먹 ink and 인주 vermilion.
   Type: Galmuri11 pixel type for numbers and play text, East Sea Dokdo brush for titles, Song Myung for headings. */
@font-face { font-family: 'Galmuri11'; src: url('fonts/Galmuri11.woff2') format('woff2'); font-display: block; }
:root {
  --void: #0a0706; --lacquer: #170f0c; --wood: #241812; --wood-2: #2f2018; --wood-3: #3c2a1e; --line: #4a3424; --line-2: #6b4c32;
  --text: #f1e6cf; --dim: #b39d80; --faint: #7d6852; --gold: #f0c560; --amber: #ee8a2c; --red: #ec5a44; --green: #7fd36a; --blue: #7fb4ff; --violet: #c4a0ff;
  --hanji: #efe4c9; --hanji-2: #e2d2ac; --ink: #241a13; --ink-2: #5b4a39; --verm: #b8321f; --verm-2: #d9472d;
  --dc-r: #b8342a; --dc-g: #2f7d6b; --dc-b: #2b4f8c; --dc-y: #e3b341; --dc-w: #f1ead8;
  --font: 'Galmuri11', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --brush: 'East Sea Dokdo', 'Galmuri11', serif;
  --serif: 'Song Myung', 'Batang', 'AppleMyungjo', serif;
  --wing: 240px; --invc: 4;
  --hanji-tex: none; --wood-tex: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--void); overflow: hidden; overscroll-behavior: none; }
body { color: var(--text); font-family: var(--font); -webkit-font-smoothing: none; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#screen { position: relative; flex: none; width: 1280px; height: 720px; overflow: hidden; background: var(--lacquer); font-size: 22px; line-height: 1.3;
  display: grid; grid-template-columns: var(--wing) 800px var(--wing); -webkit-user-select: none; user-select: none; touch-action: manipulation; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
.gold { color: var(--gold); } .bad { color: var(--red); } .dim { color: var(--dim); } .small { font-size: 16px; }

/* shared surfaces */
.dancheong { height: 12px; flex: none; background:
  linear-gradient(90deg, transparent 0 6px, var(--dc-y) 6px 8px, transparent 8px) 0 0 / 22px 12px,
  linear-gradient(to bottom, var(--dc-r) 0 3px, var(--dc-w) 3px 4px, var(--dc-g) 4px 8px, var(--dc-w) 8px 9px, var(--dc-b) 9px 12px); box-shadow: 0 2px 0 rgba(0,0,0,.5); }
.paper { --text: var(--ink); --dim: #6d5a45; --faint: #9a8466; --gold: var(--verm); --red: #a3241a; --green: #2f7a35; --line: #c8b38a; --line-2: #a78d62; --panel-2: rgba(255,250,235,.45); --panel-3: rgba(184,50,31,.08);
  color: var(--ink); background: var(--hanji-tex), radial-gradient(ellipse at 50% 40%, #f4ead2 0%, var(--hanji) 55%, var(--hanji-2) 100%); text-shadow: none; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 14px; min-height: 40px; color: var(--text); font-size: 20px;
  background: var(--wood-tex), linear-gradient(#3e2c1f, #2a1c13); border: 2px solid #120b08; border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,220,170,.18), inset 0 -3px 0 rgba(0,0,0,.35), 0 2px 0 rgba(0,0,0,.5); }
.btn:hover:not(:disabled) { color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold), inset 0 -3px 0 rgba(0,0,0,.35), 0 2px 0 rgba(0,0,0,.5); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: linear-gradient(#cf4a30, #9c2a18); color: #fff3dc; border-color: #4a120a; text-shadow: 1px 1px 0 rgba(0,0,0,.4); }
.btn.primary:hover:not(:disabled) { color: #fff; box-shadow: inset 0 0 0 2px #ffd38a, 0 2px 0 rgba(0,0,0,.5); }
.btn.danger { color: #ffb4a5; }
.btn.big { font-size: 24px; min-height: 52px; padding: 8px 26px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.on { color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); }
.paper .btn:not(.primary) { color: #f3e7cd; }

/* ───── wings ───── */
.wing { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 6px; padding: 0 10px 10px; min-height: 0;
  background: var(--wood-tex), linear-gradient(90deg, #1a110d, #22160f 50%, #1a110d); box-shadow: inset 0 0 40px rgba(0,0,0,.6); }
#wingL { grid-column: 1; border-right: 4px solid #0c0806; } #wingR { grid-column: 3; border-left: 4px solid #0c0806; }
.wing > .dancheong { margin: 0 -10px 2px; }
.cap { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cap b { font-family: var(--serif); font-weight: 400; font-size: 21px; color: var(--hanji); letter-spacing: 2px; }
.cap span { font-size: 13px; color: var(--faint); }

/* purse */
#purse { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 4px; box-shadow: inset 0 2px 6px rgba(0,0,0,.5); }
#purse .pouch { width: 40px; height: 40px; flex: none; image-rendering: pixelated; filter: drop-shadow(0 0 6px rgba(240,197,96,.35)); }

#purse.tick #goldVal { animation: tick .22s ease-out; }
@keyframes tick { 0% { transform: scale(1.14); color: #fff2b0; } 100% { transform: none; } }
@keyframes deny { 0%, 50% { color: var(--red); transform: translateX(-3px); } 25%, 75% { transform: translateX(3px); } 100% { color: var(--gold); } }
#incomeVal { font-size: 15px; color: #e9cf8f; }

/* shop cards: lacquered plaques with a tier tassel */
#shop { display: grid; grid-template-columns: 1fr; gap: 5px; }
.card { position: relative; height: 61px; display: grid; grid-template-columns: 50px 1fr; grid-template-rows: auto auto; column-gap: 9px; align-content: center; align-items: center;
  padding: 3px 26px 3px 6px; text-align: left; color: var(--text); background: var(--wood-tex), linear-gradient(100deg, #34241a, #261910); border: 1px solid #0f0906; border-radius: 4px;
  box-shadow: inset 0 1px 0 rgba(255,220,170,.12), inset 3px 0 0 var(--tier, var(--line)), 0 2px 0 rgba(0,0,0,.45); transition: transform .08s; }
.card::after { content: ''; position: absolute; right: 7px; top: 6px; width: 6px; height: 22px; border-radius: 2px 2px 3px 3px; background: linear-gradient(var(--tier), color-mix(in srgb, var(--tier) 60%, #000)); opacity: .9; }
.card:hover:not(:disabled) { transform: translateX(3px); box-shadow: inset 0 0 0 1px var(--gold), inset 3px 0 0 var(--tier), 0 0 14px rgba(240,197,96,.18); }
.card .ico { grid-row: span 2; width: 48px; height: 48px; image-rendering: pixelated; padding: 6px; background: radial-gradient(circle, color-mix(in srgb, var(--tier) 28%, #120b08) 0%, #120b08 75%); border: 1px solid color-mix(in srgb, var(--tier) 70%, #000); border-radius: 3px; }
.card .nm { font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: end; }
.card .sub { display: flex; gap: 6px; align-items: baseline; white-space: nowrap; overflow: hidden; align-self: start; }
.card .pr { font-size: 16px; color: var(--gold); } .card .tg { font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
.card .key { position: absolute; right: 4px; bottom: 3px; font-size: 13px; color: var(--faint); }
.card.poor .pr { color: var(--red); } .card.poor .ico { filter: saturate(.5) brightness(.8); }
.card.sold { background: rgba(0,0,0,.28); border: 1px dashed #4a3424; box-shadow: none; }
.card.sold::after { display: none; }
.card.sold .soldmark { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--brush); font-size: 30px; color: rgba(184,50,31,.55); transform: rotate(-6deg); }
.card.armed { box-shadow: inset 0 0 0 2px var(--gold), inset 3px 0 0 var(--tier), 0 0 16px rgba(240,197,96,.3); }
#reroll { min-height: 44px; font-size: 18px; margin-top: auto; } #reroll .free { color: var(--green); }

/* beacon status */
#res { display: grid; gap: 4px; padding: 8px 10px; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 4px; box-shadow: inset 0 2px 6px rgba(0,0,0,.5); }
#flames { display: flex; gap: 4px; justify-content: space-between; }
#flames i { flex: 1; height: 24px; background: no-repeat center / contain; image-rendering: pixelated; }
.res-row { display: flex; justify-content: space-between; align-items: baseline; }
#hpVal { font-size: 20px; } #regenVal { color: var(--green); font-size: 15px; }
.hpbar { position: relative; height: 10px; background: #2a0e0a; border: 1px solid #000; border-radius: 2px; overflow: hidden; }
.hpbar i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .12s; } #hpFill { background: linear-gradient(90deg, #d8452a, #f3a33a 70%, #ffd77a); } #shFill { background: rgba(140,210,255,.85); height: 3px; top: auto; }
#defVal { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 14px; color: var(--dim); }

/* smite: a vermilion talisman */
#bSmite { position: relative; min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff4dc; font-size: 20px;
  background: linear-gradient(#c93b26, #8f2414); border: 2px solid #3a0d07; border-radius: 3px; box-shadow: inset 0 0 0 2px rgba(243,201,74,.55), 0 2px 0 rgba(0,0,0,.5); text-shadow: 1px 1px 0 rgba(0,0,0,.45); }
#bSmite b { font-family: var(--brush); font-weight: 400; font-size: 32px; line-height: .8; color: #ffe6a0; }
#bSmite span { color: #ffe6a0; }
#bSmite:not(:disabled) { animation: charge 2.4s ease-in-out infinite; }
#bSmite:disabled { filter: grayscale(.8) brightness(.6); cursor: not-allowed; animation: none; }
@keyframes charge { 50% { box-shadow: inset 0 0 0 2px rgba(255,230,160,.9), 0 0 16px rgba(236,90,68,.45), 0 2px 0 rgba(0,0,0,.5); } }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tools .btn { min-height: 34px; padding: 2px 0; font-size: 15px; }

/* bag */
#invTabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
#invTabs button { padding: 2px 0; background: none; border: 0; border-bottom: 2px solid transparent; font-size: 14px; color: var(--faint); }
#invTabs button.on { color: var(--gold); border-bottom-color: var(--gold); } #invTabs sup { font-size: 10px; color: var(--text); }
#inv { display: grid; grid-template-columns: repeat(var(--invc), 1fr); gap: 4px; }
.slot { aspect-ratio: 1; background: radial-gradient(circle at 50% 40%, #1c120d, #0d0806); border: 1px solid #000; border-radius: 3px; box-shadow: inset 0 2px 4px rgba(0,0,0,.7), 0 1px 0 rgba(255,220,170,.06); display: grid; place-items: center; }
.slot.full { cursor: pointer; background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--tier) 30%, #140c08), #0d0806 75%); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tier) 75%, #000), inset 0 2px 4px rgba(0,0,0,.5); }
.slot.full:hover, .slot.sel { box-shadow: inset 0 0 0 2px var(--gold), 0 0 10px rgba(240,197,96,.25); }
.slot.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(1.35); filter: brightness(2); } 100% { transform: none; } }
.slot { position: relative; } .slot img { width: 36px; height: 36px; image-rendering: pixelated; }
.slot .cnt { position: absolute; right: 2px; bottom: 0; font-weight: 400; font-size: 15px; color: #ffe39a; text-shadow: 1px 1px 0 #000, -1px 0 0 #000, 0 -1px 0 #000; }
.card .own { position: absolute; right: 16px; top: 3px; font-size: 13px; color: #ffe39a; background: rgba(0,0,0,.55); padding: 0 4px; border-radius: 2px; }
#invCount { font-size: 14px; color: var(--faint); }

/* ───── battlefield ───── */
#field { position: relative; grid-column: 2; width: 800px; height: 720px; background: #000; overflow: hidden; }
#field.bump { animation: bump .5s ease-out; }
@keyframes bump { 0% { transform: scale(1.025); } 100% { transform: none; } }
#cv { position: absolute; left: 0; top: 0; width: 800px; height: 720px; }
#hud { position: absolute; left: 0; right: 0; top: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.scroll { position: relative; display: flex; align-items: center; gap: 16px; padding: 5px 26px 9px; min-width: 430px; justify-content: center; border-radius: 2px; box-shadow: 0 4px 10px rgba(0,0,0,.55); }
.scroll::before, .scroll::after { content: ''; position: absolute; top: -4px; bottom: -4px; width: 12px; border-radius: 5px; background: linear-gradient(90deg, #3a2414, #8a5a34 45%, #3a2414); box-shadow: 0 2px 4px rgba(0,0,0,.6); }
.scroll::before { left: -8px; } .scroll::after { right: -8px; }
#hDiff { font-size: 15px; color: var(--ink-2); }
#hRound { font-family: var(--serif); font-size: 22px; color: var(--ink); } #hRound b { font-family: var(--font); color: var(--verm); font-weight: 400; font-size: 24px; } #hRound b.boss { color: var(--verm); }
#hTime { min-width: 3.2em; text-align: right; color: var(--ink); font-size: 22px; }
.hEn { color: var(--ink-2); font-size: 17px; } #hEnemy { color: var(--verm); font-size: 21px; }
#fuse { position: absolute; left: 14px; right: 14px; bottom: 3px; height: 3px; background: rgba(36,26,19,.18); }
#fuse i { position: absolute; left: 0; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, #6b4a2a 0 3px, #8a6438 3px 6px); transition: width .1s linear; }
#fuse i::after { content: ''; position: absolute; right: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle, #fff6c0 0 25%, #ffb347 40%, rgba(238,90,40,0) 70%); animation: spark .18s steps(2) infinite; }
@keyframes spark { 50% { transform: scale(1.5); } }
#hArmor { display: flex; gap: 10px; align-items: center; font-size: 16px; color: var(--hanji); text-shadow: 1px 1px 0 #000, 0 0 6px #000; }
.seal { display: inline-block; padding: 1px 7px 0; font-family: var(--serif); font-size: 18px; color: #1a120c; background: var(--sc); border-radius: 3px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.25), 0 1px 3px rgba(0,0,0,.6); text-shadow: none; }
.seal.next { opacity: .8; transform: scale(.9); }
.hud-btns { position: absolute; right: 10px; top: 0; display: flex; gap: 6px; pointer-events: auto; }
.hud-btns .btn { min-height: 36px; min-width: 52px; font-size: 17px; padding: 2px 10px; }
#bossBar { position: absolute; left: 140px; right: 140px; top: 92px; padding: 0 4px; pointer-events: none; text-align: center; }
#bossName { font-family: var(--brush); font-size: 34px; line-height: .9; color: #ffcfc4; text-shadow: 0 0 10px rgba(200,40,40,.7), 2px 2px 0 #000; }
.bbar { position: relative; height: 12px; margin-top: 2px; background: #1d0a10; border: 2px solid #000; box-shadow: 0 0 0 1px #8a3b2a, 0 0 18px rgba(200,50,40,.35); }
.bbar i { display: block; height: 100%; background: linear-gradient(#ff7a5a, #b0241a); transition: width .15s; }
#banner { position: absolute; left: 0; right: 0; top: 220px; display: flex; flex-direction: column; align-items: center; pointer-events: none; animation: bannerIn 2.3s ease-out both; }
#banner::before { content: ''; position: absolute; left: 50%; top: 50%; width: 760px; height: 150px; transform: translate(-50%, -54%); z-index: -1;
  background: radial-gradient(ellipse 50% 42% at 50% 50%, rgba(10,6,6,.72) 0%, rgba(10,6,6,.45) 55%, rgba(10,6,6,0) 100%); }
#banner .b-title { font-family: var(--brush); font-size: 92px; line-height: .95; color: #fbf1da; text-shadow: 0 0 22px rgba(255,170,80,.35), 3px 3px 0 #000; animation: brushIn .5s ease-out both; }
#banner .b-sub { font-family: var(--serif); font-size: 24px; color: var(--gold); margin-top: 2px; text-shadow: 2px 2px 0 #000; }
#banner .stamp { position: absolute; top: -6px; margin-left: 360px; padding: 4px 6px; font-family: var(--serif); font-size: 20px; line-height: 1.05; writing-mode: vertical-rl; color: #fff0de; background: var(--verm); border-radius: 4px; transform: rotate(8deg); box-shadow: 0 0 0 2px rgba(255,240,220,.25) inset; animation: stamp .45s .25s cubic-bezier(.2,1.6,.4,1) both; }
#banner.boss .b-title { color: #ffb3a5; text-shadow: 0 0 26px rgba(220,40,30,.6), 3px 3px 0 #000; }
#banner.gold .b-title, #banner.set .b-title { color: #ffe39a; text-shadow: 0 0 26px rgba(255,190,80,.55), 3px 3px 0 #000; }
@keyframes bannerIn { 0% { opacity: 0; } 8%, 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes brushIn { 0% { clip-path: inset(-40% 100% -40% -10%); transform: translateX(-12px); } 100% { clip-path: inset(-40% -10% -40% -10%); transform: none; } }
@keyframes stamp { 0% { opacity: 0; transform: scale(2.4) rotate(-10deg); } 100% { opacity: 1; transform: rotate(8deg); } }
#fpanel { position: absolute; right: 10px; top: 128px; width: 404px; max-height: 560px; overflow: auto; padding: 12px 14px; font-size: 17px; background: rgba(14,9,7,.94); border: 1px solid var(--line-2); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
#fpanel h3 { margin: 0 0 8px; font-family: var(--serif); font-size: 24px; font-weight: 400; color: var(--gold); }
.sets { display: grid; gap: 6px; } .set { padding: 5px 8px; border: 1px solid var(--line); border-radius: 3px; } .set.on { border-color: #8a6a33; background: linear-gradient(90deg, rgba(240,197,96,.12), transparent); }

#prevCv { width: 100%; height: auto; aspect-ratio: 300 / 96; border: 3px solid #2a1a10; border-radius: 2px; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,.35); }
.dname { display: flex; align-items: baseline; gap: 14px; } .dname b { font-family: var(--brush); font-size: 54px; line-height: .9; font-weight: 400; } .dname span { color: var(--dim); font-size: 17px; }
.reward { margin: 0; padding: 6px 10px; border: 1px solid var(--verm); color: var(--verm); font-size: 17px; border-radius: 2px; }
.dview .btn.big { margin-top: 0; }
.sel-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: auto; }
.perks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.perk { display: flex; flex-direction: column; gap: 6px; padding: 12px; background: rgba(255,252,240,.4); border: 1px solid var(--line); border-radius: 2px; }
.perk p { margin: 0; font-size: 17px; } .ph { display: flex; justify-content: space-between; } .ph b { font-family: var(--serif); font-weight: 400; font-size: 22px; } .ph .lv { color: var(--verm); }
.pips { display: flex; gap: 3px; } .pips i { flex: 1; height: 6px; background: rgba(36,26,19,.15); border-radius: 1px; } .pips i.on { background: var(--verm); }
.perk .btn { margin-top: auto; font-size: 16px; }
.rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; flex: 1; min-height: 0; }
.rank-info { display: flex; flex-direction: column; gap: 12px; } .rank-info p { margin: 0; }
.field-row { display: flex; align-items: center; gap: 10px; font-size: 18px; color: var(--dim); }
.board-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.seg { display: flex; border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden; } .seg button { background: rgba(255,252,240,.4); border: 0; padding: 3px 12px; font-size: 16px; color: var(--dim); } .seg button.on { background: var(--verm); color: #fff2dc; }
.tbl { max-height: 440px; overflow: auto; border: 1px solid var(--line); background: rgba(255,252,240,.3); }
table.rank { width: 100%; border-collapse: collapse; font-size: 17px; }
table.rank th { font-weight: 400; color: var(--dim); text-align: left; padding: 6px 8px; border-bottom: 2px solid var(--line); font-size: 15px; }
table.rank td { padding: 5px 8px; border-bottom: 1px solid rgba(168,141,98,.35); white-space: nowrap; }
table.rank .r { text-align: right; } table.rank td.rk { color: var(--faint); } table.rank tbody tr:nth-child(-n+3) td.rk { color: var(--verm); }
table.rank tr.me td { background: rgba(184,50,31,.1); } table.rank td.empty { text-align: center; color: var(--faint); padding: 18px; }
table.rank td.nick { max-width: 9em; overflow: hidden; text-overflow: ellipsis; }
.settings { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
table.keys { border-collapse: collapse; font-size: 17px; } table.keys td { padding: 3px 12px 3px 0; } table.keys td:first-child { color: var(--verm); white-space: nowrap; }

/* phones held sideways: wider wings, larger type, a 6-column bag */
#screen.wide { --invc: 6; }
#screen.wide .card { height: 61px; } #screen.wide .card .nm { font-size: 23px; } #screen.wide .card .pr { font-size: 19px; } #screen.wide .card .tg { font-size: 15px; }
#screen.wide #invTabs { grid-template-columns: repeat(8, 1fr); } #screen.wide #invTabs button { font-size: 15px; }
#screen.wide .tools .btn { font-size: 18px; min-height: 40px; } #screen.wide #bSmite { min-height: 52px; font-size: 22px; }
#screen.wide #goldVal { font-size: 32px; } #screen.wide #hpVal { font-size: 22px; } #screen.wide #defVal { font-size: 16px; }

#rotate { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; background: var(--void); color: var(--text); font-family: var(--font); font-size: 20px; text-align: center; }
#rotate .phone { width: 46px; height: 80px; border: 4px solid var(--gold); border-radius: 9px; box-shadow: inset 0 -8px 0 -4px var(--gold); animation: turn 2.4s ease-in-out infinite; }
#rotate p { max-width: 22em; }
#rotate h2 { margin: 0; font-family: var(--brush); font-weight: 400; font-size: 46px; color: var(--hanji); }
#rotate p { margin: 0; color: var(--dim); font-size: 17px; line-height: 1.5; }
#rotate .btn { min-width: 220px; }
@keyframes turn { 0%, 30% { transform: none; } 60%, 100% { transform: rotate(90deg); } }
@media (prefers-reduced-motion: reduce) { #banner, #banner .b-title, #banner .stamp, .logo h1, .mcard, #bSmite { animation: none !important; } }
</style>

<body>
<div id="stage">
  <div id="screen">
    <aside id="wingL" class="wing" aria-label="장터">
      <div class="dancheong"></div>
      <div class="cap"><b>장터</b><span>1~8 구매 · R 새로고침</span></div>
      <div id="purse"><img class="pouch" alt=""><div><span id="goldVal">0</span><span id="incomeVal"></span></div></div>
      <div id="shop"></div>
      <button class="btn" id="reroll" data-act="reroll">새로고침 [R]</button>
    </aside>

    <section id="field" aria-label="전장">
      <canvas id="cv" width="400" height="360" aria-label="봉수대와 몰려오는 적"></canvas>
      <div id="hud">
        <div class="scroll paper"><span id="hDiff"></span><span id="hRound"></span><span id="hTime"></span><span class="hEn">적 <span id="hEnemy">0</span></span><div id="fuse"><i></i></div></div>
        <div id="hArmor"></div>
        <div class="hud-btns"><button class="btn" id="bPause" data-act="pause" title="멈춤 [Space]">Ⅱ</button><button class="btn" id="bSpeed" data-act="speed" title="배속 [Tab]">×1</button></div>
      </div>
      <div id="bossBar" hidden><div id="bossName"></div><div class="bbar"><i id="bossFill"></i></div></div>
      <div id="banner" hidden></div>
      <div id="fpanel" hidden></div>
      <div id="toast" class="paper" role="status" hidden></div>
    </section>

    <aside id="wingR" class="wing" aria-label="봉수대와 봇짐">
      <div class="dancheong"></div>
      <div class="cap"><b>봉수대</b><span>다섯 홰가 꺼지면 끝</span></div>
      <div id="res">
        <div id="flames"></div>
        <div class="res-row"><span id="hpVal"></span><span id="regenVal"></span></div>
        <div class="hpbar"><i id="hpFill"></i><i id="shFill"></i></div>
        <div id="defVal"></div>
      </div>
      <button id="bSmite" data-act="smite">천벌</button>
      <div class="tools">
        <button class="btn" data-act="fp" data-id="set" title="세트 [B]">세트</button>
        <button class="btn" data-act="fp" data-id="meter" title="딜미터 [D]">딜량</button>
        <button class="btn" id="bRange" data-act="range" title="사거리 [G]">사거리</button>
        <button class="btn" data-act="fp" data-id="match" title="상성 [H]">상성</button>
      </div>
      <div class="cap"><b>봇짐</b><span id="invCount"></span></div>
      <div id="invTabs"></div>
      <div id="inv"></div>
    </aside>

    <canvas id="ov" width="640" height="360" aria-hidden="true"></canvas>
    <div id="tip" hidden></div>
    <div id="coach" hidden></div>

    <div id="menu">
      <canvas id="titleCv" width="640" height="360" aria-hidden="true"></canvas>
      <div id="menuBody"></div>
    </div>

    <div id="modal" hidden><div id="modalCard" class="mcard paper" role="dialog" aria-modal="true"></div></div>
  </div>
</div>
<div id="rotate" hidden>
  <div class="phone" aria-hidden="true"></div>
  <h2>가로 화면으로 할까요?</h2>
  <p>봉화대 사수는 가로 화면에 맞춰져 있습니다.<br>휴대폰을 돌리지 않아도 화면을 가로로 돌려 드립니다.</p>
  <button class="btn primary big" data-act="rotate-go">가로로 보기</button>
  <button class="btn" data-act="rotate-skip">세로 그대로 보기</button>
</div>
